# Base de données H2 en mémoire pour les tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuration JPA pour les tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Désactiver Liquibase pour les tests (utiliser Hibernate ddl-auto à la place)
spring.liquibase.enabled=false

# Configuration Spring Security (pour le bypass via TestSecurityConfig)
spring.security.user.name=test
spring.security.user.password=test


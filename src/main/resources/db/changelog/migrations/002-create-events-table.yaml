databaseChangeLog:
  - changeSet:
      id: create-events-table
      author: eventify
      changes:
        - createTable:
            tableName: events
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: location
                  type: VARCHAR(255)
              - column:
                  name: date_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: capacity
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: organizer_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_events_organizer
                    references: users(id)
        - createIndex:
            indexName: idx_events_organizer_id
            tableName: events
            columns:
              - column:
                  name: organizer_id
        - createIndex:
            indexName: idx_events_date_time
            tableName: events
            columns:
              - column:
                  name: date_time


databaseChangeLog:
  - changeSet:
      id: create-registrations-table
      author: eventify
      changes:
        - createTable:
            tableName: registrations
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_registrations_user
                    references: users(id)
              - column:
                  name: event_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_registrations_event
                    references: events(id)
              - column:
                  name: registered_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                    defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    defaultValue: 'REGISTERED'
        - createIndex:
            indexName: idx_registrations_user_id
            tableName: registrations
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_registrations_event_id
            tableName: registrations
            columns:
              - column:
                  name: event_id
        - addUniqueConstraint:
            constraintName: uk_registrations_user_event
            tableName: registrations
            columnNames: user_id, event_id
        - sql:
            sql: ALTER TABLE registrations ADD CONSTRAINT ck_registrations_status CHECK (status IN ('REGISTERED', 'CANCELLED'))

